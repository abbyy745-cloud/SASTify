<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050609" />
    <meta name="color-scheme" content="dark" />
    <title>SASTify — AI-Powered Security Dashboard</title>
    <meta name="description" content="SASTify is an AI-powered static analysis security tool that identifies vulnerabilities in your code, providing detailed insights and remediation guidance." />
    <meta property="og:title" content="SASTify — AI-Powered Security Scanner" />
    <meta property="og:description" content="Secure your code before it ships. AI-powered static analysis for Python, JavaScript, Java, Swift, Kotlin, Dart and more." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />

    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            background: #050609;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            color: #e8e8f0;
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.25); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99,102,241,0.4); }
        
        /* Selection colors */
        ::selection { background: rgba(99,102,241,0.35); color: #fff; }

        /* Smooth scrolling */
        html { scroll-behavior: smooth; }
    </style>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
